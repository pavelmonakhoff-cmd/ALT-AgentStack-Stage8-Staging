name: Stage 8 Staging Review Fixture
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - stage8/staging-target
permissions:
  contents: read
  pull-requests: write
jobs:
  approve:
    if: startsWith(github.event.pull_request.head.ref, 'agent-remote/')
    runs-on: ubuntu-latest
    steps:
      - name: Approve staging PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr review "$PR_NUMBER" --repo "$REPOSITORY" --approve --body "Automated Stage 8 staging fixture approval for exact protected-branch validation."
